<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poker OS Regression</title>
<style>body{font-family:system-ui,sans-serif;background:#0f1522;color:#e9edf5;padding:16px;font-size:15px}.ok{color:#5fe0a6}.bad{color:#ff8b9a}pre{white-space:pre-wrap;font-size:12px;background:#182036;padding:8px;border-radius:8px}iframe{width:1px;height:1px;border:0;opacity:0}</style>
</head><body>
<h2>Poker OS 회귀 테스트</h2>
<p>앱을 숨은 창으로 불러와 정본 규칙·레이크·턴 규칙만 검사합니다. 핸드 기록은 바꾸지 않습니다.</p>
<div id="out">실행 중…</div>
<iframe id="app"></iframe>
<script>
// 캐시 회피: 항상 지금 배포된 index.html·regression.js를 검사한다(GitHub Pages CDN이 이전 파일을 줄 수 있음).
(function(){
  var s=document.createElement('script');
  s.src='regression.js?v='+Date.now();
  s.onerror=function(){var o=document.getElementById('out');if(o)o.innerHTML='<p class="bad">regression.js 로드 실패</p>'};

=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}if(typeof runPokerOSRegressionV61==='function'){const x=runPokerOSRegressionV61(D,document.getElementById('app').contentDocument);const f=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}if(typeof runPokerOSRegressionV60==='function'){const x=runPokerOSRegressionV60(D,document.getElementById('app').contentDocument);const f=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}if(typeof runPokerOSRegressionV59==='function'){const x=runPokerOSRegressionV59(D);const f=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}if(typeof runPokerOSRegressionV58==='function'){const x=runPokerOSRegressionV58(D,document.getElementById('app').contentDocument);const f=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}if(typeof runPokerOSRegressionV57==='function'){const x=runPokerOSRegressionV57(D,document.getElementById('app').contentDocument);const f=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}if(typeof runPokerOSRegressionV56==='function'){const x=runPokerOSRegressionV56(D);const f=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}if(typeof runPokerOSRegressionV55==='function'){const x=runPokerOSRegressionV55(D);const f=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}if(typeof runPokerOSRegressionV54==='function'){const x=runPokerOSRegressionV54(D,document.getElementById('app').contentDocument);const f=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}
    if(typeof runPokerOSRegressionV613==='function'){const x=runPokerOSRegressionV613(D,document.getElementById('app').contentDocument);const f=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}
    if(typeof runPostflopCanonRegression==='function'){const x=runPostflopCanonRegression(D);const f=x.filter(t=>!t.pass);r.total+=x.length;r.passed+=x.length-f.length;r.failed=r.failed.concat(f)}
    out.innerHTML=`<h3 class="${r.failed.length?'bad':'ok'}">${r.passed} / ${r.total} PASS</h3>`+
      (r.failed.length?'<pre>'+r.failed.map(f=>'✗ '+f.name+'\n'+JSON.stringify(f.got,null,1)).join('\n\n')+'</pre>':'<p class="ok">모든 검사를 통과했습니다.</p>');
  }catch(e){out.innerHTML='<p class="bad">실행 오류: '+e+'</p>'}
    },800)});
    appFrame.src='../index.html?v='+Date.now();
  };
  document.body.appendChild(s);
})();
</script>
</body></html>
